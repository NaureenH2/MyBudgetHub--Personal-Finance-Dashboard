<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Welcome — MyBudgetHub</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="auth.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #0f172a, #020617);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f9fafb;
      display: flex;
      flex-direction: column;
    }

    .frontpage-container {
      width: 100%;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }

    .image-section {
      position: relative;
      width: 100%;
      height: 50vh;
      min-height: 300px;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    .frontpage-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      margin: 0;
      padding: 0;
    }

    .image-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(
        to bottom,
        rgba(15, 23, 42, 0.4) 0%,
        rgba(15, 23, 42, 0.6) 100%
      );
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .frontpage-container h1 {
      font-size: 5rem;
      color: #032650;
      letter-spacing: -0.5px;
      text-shadow: 
        0 0 15px rgba(37, 99, 235, 0.6),
        0 0 30px rgba(37, 99, 235, 0.5),
        0 6px 18px rgba(37, 99, 235, 0.4);
      margin: 0;
      font-weight: 700;
    }

    .content-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
      text-align: center;
      background: rgba(243, 244, 246, 0.05);
    }

    .tagline {
      font-size: 1.15rem;
      color: #d1d5db;
      margin-bottom: 2.5rem;
      line-height: 1.75;
      max-width: 600px;
    }

    .frontpage-actions {
      display: flex;
      justify-content: center;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    .btn {
      padding: 0.75rem 1.75rem;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      font-size: 1rem;
    }

    .btn.primary {
      background: #2563eb;
      color: white;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
    }

    .btn.primary:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4);
    }

    .btn.secondary {
      background: transparent;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      color: #e5e7eb;
    }

    .btn.secondary:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    @media (max-width: 768px) {
      .frontpage-container h1 {
        font-size: 2.2rem;
      }

      .tagline {
        font-size: 1rem;
        margin-bottom: 2rem;
      }

      .frontpage-actions {
        flex-direction: column;
        width: 100%;
        max-width: 300px;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="frontpage-container">

    <div class="image-section">
      <img src="../images/frontpage3.jpg" alt="MyBudgetHub" class="frontpage-image" />
      <div class="image-overlay">
    <h1>MyBudgetHub</h1>
      </div>
    </div>

    <div class="content-section">
    <p class="tagline">
      Take control of your money. Track expenses, manage budgets, and
      understand your spending — all in one place.
    </p>

      <!-- Show login/register buttons only if not authenticated -->
      <div class="frontpage-actions" data-auth="unauthenticated">
      <a href="login.html" class="btn primary">Log In</a>
      <a href="register.html" class="btn secondary">Create Account</a>
      </div>

      <!-- Show dashboard link if authenticated -->
      <div class="frontpage-actions" data-auth="authenticated" style="display: none;">
        <a href="index.html" class="btn primary">Go to Dashboard</a>
        <button data-logout-btn class="btn secondary">Log Out</button>
      </div>
    </div>

  </div>

  <script>
    // Redirect to dashboard if already authenticated, otherwise show appropriate UI
    initAuth({ redirectIfAuth: true });
  </script>

</body>
</html>

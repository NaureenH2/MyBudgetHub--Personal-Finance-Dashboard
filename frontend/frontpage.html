<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Welcome — MyBudgetHub</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="auth.js"></script>
  <style>
    body {
      background: #f9fafb;
      color: #1f2937;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .frontpage-container {
      max-width: 520px;
      margin: 120px auto;
      padding: 3rem 2.5rem;
      text-align: center;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }

    .frontpage-container h1 {
      font-size: 2.25rem;
      margin-bottom: 0.75rem;
      color: #1e3a8a; /* deep blue */
    }

    .tagline {
      font-size: 1.05rem;
      color: #4b5563;
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }

    .frontpage-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn.primary {
      background: #1e3a8a;
      color: white;
    }

    .btn.primary:hover {
      background: #1e40af;
    }

    .btn.secondary {
      border: 2px solid #1e3a8a;
      color: #1e3a8a;
      background: transparent;
    }

    .btn.secondary:hover {
      background: #eef2ff;
    }
  </style>
</head>
<body>

  <div class="frontpage-container">

    <h1>MyBudgetHub</h1>

    <p class="tagline">
      Take control of your money. Track expenses, manage budgets, and
      understand your spending — all in one place.
    </p>

    <!-- Show login/register buttons only if not authenticated -->
    <div class="frontpage-actions" data-auth="unauthenticated">
      <a href="login.html" class="btn primary">Log In</a>
      <a href="register.html" class="btn secondary">Create Account</a>
    </div>

    <!-- Show dashboard link if authenticated -->
    <div class="frontpage-actions" data-auth="authenticated" style="display: none;">
      <a href="index.html" class="btn primary">Go to Dashboard</a>
      <button data-logout-btn class="btn secondary">Log Out</button>
    </div>

  </div>

  <script>
    // Redirect to dashboard if already authenticated, otherwise show appropriate UI
    initAuth({ redirectIfAuth: true });
  </script>

</body>
</html>

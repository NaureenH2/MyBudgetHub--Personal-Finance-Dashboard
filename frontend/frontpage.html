<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Welcome — MyBudgetHub</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="auth.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #0f172a, #020617);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f9fafb;
    }

    .frontpage-container {
      max-width: 520px;
      padding: 3rem 2.75rem;
      background: rgba(243, 244, 246, 0.08);
      backdrop-filter: blur(14px);
      border-radius: 18px;
      box-shadow:
        0 20px 40px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      text-align: center;
    }

    .frontpage-container h1 {
      font-size: 2.4rem;
      margin-bottom: 0.75rem;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .tagline {
      font-size: 1.05rem;
      color: #d1d5db;
      margin-bottom: 2.75rem;
      line-height: 1.65;
    }

    .frontpage-actions {
      display: flex;
      justify-content: center;
      gap: 1.25rem;
    }

    .btn {
      padding: 0.75rem 1.75rem;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn.primary {
      background: #2563eb;
      color: white;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
    }

    .btn.primary:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .btn.secondary {
      background: transparent;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      color: #e5e7eb;
    }

    .btn.secondary:hover {
      background: rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>

  <div class="frontpage-container">

    <h1>MyBudgetHub</h1>

    <p class="tagline">
      Take control of your money. Track expenses, manage budgets, and
      understand your spending — all in one place.
    </p>

    <!-- Show login/register buttons only if not authenticated -->
    <div class="frontpage-actions" data-auth="unauthenticated">
      <a href="login.html" class="btn primary">Log In</a>
      <a href="register.html" class="btn secondary">Create Account</a>
    </div>

    <!-- Show dashboard link if authenticated -->
    <div class="frontpage-actions" data-auth="authenticated" style="display: none;">
      <a href="index.html" class="btn primary">Go to Dashboard</a>
      <button data-logout-btn class="btn secondary">Log Out</button>
    </div>

  </div>

  <script>
    // Redirect to dashboard if already authenticated, otherwise show appropriate UI
    initAuth({ redirectIfAuth: true });
  </script>

</body>
</html>

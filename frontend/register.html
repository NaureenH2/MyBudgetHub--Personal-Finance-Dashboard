<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register — MyBudgetHub</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #0f172a, #020617);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f9fafb;
    }

    .auth-container {
      max-width: 420px;
      padding: 3rem 2.75rem;
      background: rgba(243, 244, 246, 0.08);
      backdrop-filter: blur(14px);
      border-radius: 18px;
      box-shadow:
        0 20px 40px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      text-align: center;
    }

    .auth-container h1 {
      font-size: 2.4rem;
      margin-bottom: 0.75rem;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .auth-container p {
      font-size: 1.05rem;
      color: #d1d5db;
      margin-bottom: 2.75rem;
      line-height: 1.65;
    }

    .form-group {
      margin-bottom: 1.5rem;
      text-align: left;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: #e5e7eb;
      font-weight: 500;
      font-size: 0.95rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      font-size: 1rem;
      box-sizing: border-box;
      background: rgba(255, 255, 255, 0.05);
      color: #f9fafb;
      transition: all 0.2s ease;
    }

    .form-group input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .form-group input:focus {
      outline: none;
      border-color: #2563eb;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    .error-message {
      color: #f87171;
      font-size: 0.9rem;
      margin-top: 0.5rem;
      display: none;
      text-align: left;
      background: rgba(248, 113, 113, 0.1);
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      border: 1px solid rgba(248, 113, 113, 0.2);
    }

    .error-message.show {
      display: block;
    }

    .success-message {
      color: #34d399;
      font-size: 0.9rem;
      margin-top: 0.5rem;
      display: none;
      text-align: left;
      background: rgba(52, 211, 153, 0.1);
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      border: 1px solid rgba(52, 211, 153, 0.2);
    }

    .success-message.show {
      display: block;
    }

    .btn-submit {
      width: 100%;
      padding: 0.75rem 1.75rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4);
    }

    .btn-submit:disabled {
      background: #475569;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
      opacity: 0.6;
    }

    .auth-links {
      text-align: center;
      margin-top: 1.5rem;
      color: #d1d5db;
      font-size: 0.95rem;
    }

    .auth-links a {
      color: #60a5fa;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .auth-links a:hover {
      color: #3b82f6;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <h1>MyBudgetHub</h1>
    <p>Create your account</p>

    <form id="registerForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          required 
          autocomplete="email"
          placeholder="your@email.com"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          required 
          autocomplete="new-password"
          placeholder="Enter a secure password"
          minlength="6"
        />
      </div>

      <div class="error-message" id="errorMessage"></div>
      <div class="success-message" id="successMessage"></div>

      <button type="submit" class="btn-submit" id="submitBtn">
        Create Account
      </button>
    </form>

    <div class="auth-links">
      Already have an account? <a href="login.html">Log in</a>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    // Redirect to dashboard if already logged in
    initAuth({ redirectIfAuth: true });
  </script>

  <script>
    const form = document.getElementById('registerForm');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // Reset messages
      errorMessage.classList.remove('show');
      successMessage.classList.remove('show');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating Account...';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('http://127.0.0.1:5000/auth/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          credentials: 'include',
          body: JSON.stringify({ email, password }),
        });

        const data = await response.json();

        if (response.ok) {
          successMessage.textContent = data.message || 'Account created successfully! Redirecting...';
          successMessage.classList.add('show');
          
          // Redirect to initial welcome page after 1.5 seconds
          setTimeout(() => {
            window.location.href = 'initial.html';
          }, 1500);
        } else {
          errorMessage.textContent = data.error || 'Registration failed. Please try again.';
          errorMessage.classList.add('show');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
        }
      } catch (error) {
        errorMessage.textContent = 'Network error. Please check if the server is running.';
        errorMessage.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });
  </script>

</body>
</html>

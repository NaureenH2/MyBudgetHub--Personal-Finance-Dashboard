<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MyBudgetHub Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="auth.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #0f172a, #020617);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f9fafb;
      padding: 2rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding: 1.5rem 2rem;
      background: rgba(243, 244, 246, 0.08);
      backdrop-filter: blur(14px);
      border-radius: 18px;
      box-shadow:
        0 20px 40px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    header h1 {
      font-size: 2.4rem;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin: 0;
    }

    header [data-user-email] {
      margin-right: 1rem;
      color: #d1d5db;
      font-size: 0.95rem;
    }

    .btn-submit {
      padding: 0.75rem 1.75rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4);
    }

    .btn-submit:disabled {
      background: #475569;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
      opacity: 0.6;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .summary-card {
      background: rgba(243, 244, 246, 0.08);
      backdrop-filter: blur(14px);
      border-radius: 18px;
      padding: 1.5rem;
      box-shadow:
        0 20px 40px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .summary-card h4 {
      margin: 0;
      font-size: 0.9rem;
      color: #d1d5db;
      font-weight: 500;
    }

    .summary-card p {
      margin-top: 0.75rem;
      font-size: 1.6rem;
      font-weight: 600;
      color: #ffffff;
    }

    .summary-card.warning {
      border-left: 5px solid #f39c12;
    }

    .summary-card.positive {
      border-left: 5px solid #2ecc71;
    }

    .summary-card.negative {
      border-left: 5px solid #e74c3c;
    }

    .good {
      color: #34d399;
      font-weight: bold;
    }

    .bad {
      color: #f87171;
      font-weight: bold;
    }

    .neutral {
      color: #9ca3af;
      font-weight: bold;
    }

    section {
      margin-bottom: 3rem;
      padding: 2rem;
      background: rgba(243, 244, 246, 0.08);
      backdrop-filter: blur(14px);
      border-radius: 18px;
      box-shadow:
        0 20px 40px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    section h2 {
      color: #ffffff;
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
      letter-spacing: -0.5px;
    }

    section canvas {
      max-height: 400px;
    }

    @media (max-width: 768px) {
      body {
        padding: 1rem;
      }

      header {
        flex-direction: column;
        gap: 1rem;
        text-align: center;
      }

      header h1 {
        font-size: 1.8rem;
      }

      .summary-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>MyBudgetHub</h1>
    <div>
      <span data-user-email></span>
      <button data-logout-btn class="btn-submit">Log Out</button>
    </div>
  </header>

  <!-- SUMMARY CARDS -->
  <div class="summary-grid">

    <div class="summary-card">
      <h4>This Month</h4>
      <p id="monthlyTotal">$0</p>
    </div>

    <div class="summary-card">
      <h4>This Month vs Last Month</h4>
      <p id="monthComparison">—</p>
    </div>

    <div class="summary-card">
      <h4>This Week vs Last Week</h4>
      <p id="weeklyComparison">—</p>
    </div>

    <div class="summary-card">
      <h4>Top Category</h4>
      <p id="topCategory">—</p>
    </div>

    <div class="summary-card warning">
      <h4>Budget Status</h4>
      <p id="budgetWarnings">OK</p>
    </div>

  </div>

  <!-- BUDGET -->
  <section id="budgets-section">
  <h2>Budgets</h2>

  <form id="budgetForm" style="margin-bottom: 1.5rem;">
    <input
      type="text"
      id="budgetCategory"
      placeholder="Category (e.g. Food)"
      required
    />

    <input
      type="number"
      id="budgetLimit"
      placeholder="Monthly Limit"
      required
      min="1"
    />

    <button type="submit" class="btn-submit">
      Add Budget
    </button>
  </form>

  <div id="budgetsList"></div>
  </section>

  <!-- EXPENSES -->
   <section class="expenses-section">
    <h2>Expenses</h2>

    <!-- Add Expense -->
    <form id="expense-form">
      <input type="text" id="expense-description" placeholder="Description" required />
      <input type="number" id="expense-amount" placeholder="Amount" step="0.01" required />
      <input type="text" id="expense-category" placeholder="Category" required />
      <input type="date" id="expense-date" required />
      <button type="submit">Add Expense</button>
    </form>

    <!-- CSV Controls -->
    <div class="csv-controls">
      <button id="export-expenses">Export CSV</button>
      <input type="file" id="import-expenses" accept=".csv" />
    </div>

    <!-- Expenses List -->
    <table>
      <thead>
        <tr>
          <th>Description</th>
          <th>Amount</th>
          <th>Category</th>
          <th>Date</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="expenses-body"></tbody>
    </table>
  </section>

  <!-- CHARTS -->
  <section>
    <h2>Spending by Category</h2>
    <canvas id="expenseChart"></canvas>
  </section>

  <section>
    <h2>Monthly Spending</h2>
    <canvas id="monthlyChart"></canvas>
  </section>

  <section>
    <h2>Budget vs Spending</h2>
    <canvas id="budgetChart"></canvas>
  </section>

  <script>
    // Require authentication for dashboard
    initAuth({ requireAuth: true });
  </script>
  <script src="app.js"></script>
  
</body>
</html>
